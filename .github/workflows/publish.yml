name: Publish radar

# Reads the Notion database, builds Build Your Own Radar with our quadrants and
# rings, and publishes both to GitHub Pages. Daily, on push, or by hand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned: the build below patches this exact source.
  BYOR_REF: 3379de7db36ce86af7b2607429be0b5f888c8120

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.config.outputs.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the exporter
        run: python -m unittest discover -s exporter -v

      - name: Read the radar config
        id: config
        run: |
          echo "title=$(jq -r .title radar.config.json)" >> "$GITHUB_OUTPUT"
          echo "subtitle=$(jq -r .subtitle radar.config.json)" >> "$GITHUB_OUTPUT"
          echo "banner=$(jq -r .bannerColor radar.config.json)" >> "$GITHUB_OUTPUT"
          echo "quadrants=$(jq -c .quadrants radar.config.json)" >> "$GITHUB_OUTPUT"
          echo "rings=$(jq -c .rings radar.config.json)" >> "$GITHUB_OUTPUT"

      - name: Export the radar from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        # BYOR titles the radar after the data file's name.
        run: python exporter/notion_to_radar.py --out "data/${{ steps.config.outputs.title }}.json"

      - uses: actions/checkout@v4
        with:
          repository: thoughtworks/build-your-own-radar
          ref: ${{ env.BYOR_REF }}
          path: byor

      - uses: actions/setup-node@v4
        with:
          node-version-file: byor/.nvmrc
          cache: npm
          cache-dependency-path: byor/package-lock.json

      - name: Build the radar
        working-directory: byor
        env:
          QUADRANTS: ${{ steps.config.outputs.quadrants }}
          RINGS: ${{ steps.config.outputs.rings }}
          ASSET_PATH: /${{ github.event.repository.name }}/
          TITLE: ${{ steps.config.outputs.title }}
          SUBTITLE: ${{ steps.config.outputs.subtitle }}
          BANNER: ${{ steps.config.outputs.banner }}
        run: |
          # BYOR renames "Hold" to "Caution" and shows a Thoughtworks notice; keep our ring names.
          sed -i 's/normalizeRingNameHoldToCaution: true/normalizeRingNameHoldToCaution: false/g' src/config.js
          if grep -q 'normalizeRingNameHoldToCaution: true' src/config.js; then
            echo "::error::the Hold->Caution toggle is still on; src/config.js changed upstream" && exit 1
          fi
          # The radar keeps BYOR's own name as its main heading and shows ours only as a
          # subtitle, taken from the data file name. Lead with ours in both places.
          sed -i "s#<h1 class=\"hero-banner__title-text\">Build your own Radar</h1>#<h1 class=\"hero-banner__title-text\">${TITLE}</h1>#" src/index.html
          if grep -q 'hero-banner__title-text">Build your own Radar<' src/index.html; then
            echo "::error::the hero banner still carries BYOR's title; src/index.html changed upstream" && exit 1
          fi
          # index.html links its images from the site root, which ASSET_PATH does not
          # reach; served from /<repo>/ the logo would 404.
          sed -i 's#src="/images/#src="images/#g' src/index.html
          if grep -q 'src="/images/' src/index.html; then
            echo "::error::index.html still links images from the site root" && exit 1
          fi
          # The footer paragraph describes Thoughtworks' own hosted service: its terms of use,
          # and a privacy policy about personal data "in your public Google Sheet". None of it
          # is true of a self-hosted radar read from Notion, so showing it would misinform
          # whoever reads this page. Drop the paragraph; the AGPL source link it also carried
          # is given on the radar's Notion page instead.
          perl -0777 -i -pe 's{\n\s*<p class="agree-terms">.*?</p>}{}s' src/index.html
          if grep -q 'agree-terms' src/index.html; then
            echo "::error::the terms-of-use paragraph is still in index.html" && exit 1
          fi
          # The top-left mark is BYOR's "Powered by <Thoughtworks logo>". This is our radar, so
          # it carries our logo. The AGPL asks for copyright and licence notices in the source
          # and for the source to be obtainable, not for a vendor mark in the interface.
          cp ../assets/bithippie-logo.png src/images/bithippie-logo.png
          # The src path is matched with an optional leading slash because the patch above has
          # already rewritten it; anchoring on "/images/" here silently matches nothing.
          perl -0777 -i -pe 's{<span>Powered by</span>\s*\n\s*<a href="https://www\.thoughtworks\.com"><img src="/?images/tw-logo\.png" alt="Thoughtworks logo" /></a>}{<a href="https://bithippie.com"><img src="images/bithippie-logo.png" alt="BitHippie" /></a>}s' src/index.html
          if ! grep -q 'bithippie-logo.png' src/index.html; then
            echo "::error::the header still carries BYOR's mark; src/index.html changed upstream" && exit 1
          fi
          # BYOR sizes the header mark at 200px wide, which suited its own near-square logo.
          # Ours is 450x125, so at that width it stands only 55px tall and reads as an
          # afterthought. The rule goes in at the end of the body, after the bundle's own
          # stylesheet, so it wins on order rather than on !important.
          perl -0777 -i -pe 's{\n(\s*)</body>}{\n$1  <style>/* bithippie */ .input-sheet__logo a img{width:min(260px,65vw)}</style>\n$1</body>}s' src/index.html
          if ! grep -q '/\* bithippie \*/' src/index.html; then
            echo "::error::the logo sizing rule was not inserted; src/index.html changed upstream" && exit 1
          fi
          # "Generate new Radar" sends the visitor to the upload form, which is meaningless
          # here: this radar is built from Notion by this workflow, not from a file someone
          # pastes in. "Print this Radar" stays.
          # BYOR fills the hero subtitle with document.title, which it takes from the data
          # file name — so the banner printed our radar's name twice. Use the configured
          # subtitle instead, and keep document.title alone: it is the browser tab text.
          # The literal is injected here rather than read from process.env at runtime: the
          # bundle only sees the variables webpack is configured to substitute, and a missing
          # one becomes undefined in the browser instead of failing the build.
          perl -0777 -i -pe 'my $s = $ENV{SUBTITLE}; $s =~ s/(["\\])/\\$1/g; s{\.classed\(.hero-banner__subtitle-text., true\)\.text\(document\.title\)}{.classed("hero-banner__subtitle-text", true).text("$s")}s' src/graphing/components/banner.js
          # Anchored on the subtitle call itself: banner.js also uses document.title in its
          # legacy branch, which this patch deliberately leaves alone, so a bare search for
          # document.title would fail the build after a perfectly good patch.
          if ! grep -q 'hero-banner__subtitle-text", true).text("' src/graphing/components/banner.js; then
            echo "::error::the subtitle was not replaced; banner.js changed upstream" && exit 1
          fi
          perl -0777 -i -pe "s{\n\s*buttonsRow\n\s*\.append\('a'\)\n.*?\.text\('Generate new Radar'\)\n}{\n}s" src/graphing/components/buttons.js
          if grep -q 'Generate new Radar' src/graphing/components/buttons.js; then
            echo "::error::the Generate new Radar button is still there; buttons.js changed upstream" && exit 1
          fi
          npm ci --no-audit --no-fund
          npm run build:prod
          cp ../data/*.json dist/
          # BYOR hardcodes "/images/..." in its stylesheet and bundle, which resolves to the
          # site root. Served from a project page at /tech-radar/ every one of them 404s, and
          # the build does not notice: the blip movement icons and the banner simply vanish.
          # ASSET_PATH only reaches assets webpack itself emitted, not these string literals.
          # BYOR's hero banner is Thoughtworks purple, and the graphic sitting on it is purple
          # too, so recolouring the background alone would leave a purple image on a green
          # band. Blending the image in on luminosity takes its light and dark from the
          # artwork and its hue from our colour, which recolours the arcs without touching
          # the white. The colour is a darker shade of the logo's green: the logo green
          # itself gives white text only 2.9:1, which fails even the large-text threshold.
          sed -i "s|background-color:#634f7d|background-color:${BANNER};background-blend-mode:luminosity|g" dist/*.css
          if grep -q '#634f7d' dist/*.css; then
            echo "::error::the banner is still Thoughtworks purple" && exit 1
          fi
          sed -i "s|(/images/|(${ASSET_PATH}images/|g" dist/*.css
          sed -i "s|\"/images/|\"${ASSET_PATH}images/|g" dist/*.js
          if grep -ho '(/images/' dist/*.css | grep -q . || grep -ho '"/images/' dist/*.js | grep -q .; then
            echo "::error::absolute /images/ references survived in the built output" && exit 1
          fi
          # The build copies src/images, but prove it rather than trust it: a missing logo is a
          # 404 nobody notices until someone opens the radar.
          if [ ! -s dist/images/bithippie-logo.png ]; then
            cp ../assets/bithippie-logo.png dist/images/bithippie-logo.png
          fi
          [ -s dist/images/bithippie-logo.png ] || { echo "::error::the logo is not in dist/images"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: byor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Embed URL
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
          TITLE: ${{ needs.build.outputs.title }}
        run: |
          data=$(jq -rn --arg u "${PAGE}${TITLE}.json" '$u | @uri')
          echo "Embed in Notion: ${PAGE}?documentId=${data}" | tee -a "$GITHUB_STEP_SUMMARY"
